name: Evident.io
description: 'Evident.io was a cloud security posture management company, founded in 2013,
  best known for the Evident Security Platform (ESP) — an agentless SaaS service that
  continuously monitored Amazon Web Services (and later Microsoft Azure) accounts for
  security misconfigurations, compliance drift, and risk across services like IAM, S3,
  EC2, and CloudTrail. ESP scored findings against frameworks such as CIS Benchmarks,
  PCI DSS, HIPAA, and SOC 2, and exposed its analysis programmatically through a REST
  API so teams could automate remediation and wire results into their DevSecOps pipelines.
  Palo Alto Networks acquired Evident.io in March 2018 for roughly $300M and folded the
  technology into what became Prisma Cloud. The standalone evident.io product, developer
  portal, and API have been retired; the domain is now defensively held with no live
  website or API surface. This record is retained for historical/network-graph
  completeness — there is no live API to enrich.'
